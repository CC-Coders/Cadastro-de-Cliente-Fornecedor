<html>
   <head>
      <!--SMSTI -->
      <link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide.min.css" />
      <script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
      <script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>
      <script type="text/javascript" src="/portal/resources/js/mustache/mustache-min.js"></script>
      <script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script>
      <script type="text/javascript" src="/webdesk/vcXMLRPC.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
      <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.19.9/docxtemplater.js"></script>
      <script src="https://unpkg.com/pizzip@3.0.6/dist/pizzip.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.8/FileSaver.js"></script>
      <script src="https://unpkg.com/pizzip@3.0.6/dist/pizzip-utils.js"></script>
      <script src="jquery-fileupload.js"></script>
      <script src="fileupload.js"></script>
      <!-- Formulário -->
      <link type="text/css" rel="stylesheet" href="cadastroFornecedor.css" />
      <script type="text/javascript" src="cadastroFornecedor.js"></script>
      <title>Cadastro de Fornecedor</title>
   </head>
   <body>
      <div class="fluig-style-guide">
         <form name="form" id="formSolicitacao">
            <!-- CAMPOS OCULTOS -->
            <div class="hidden" style="display: none">
                <input type="hidden" id="atividade" name="atividade">
                <input type="hidden" id="formMode" name="formMode">
                <input type="hidden" id="solicitante" name="solicitante">
                <!-- TABELA HISTÓRICO -->
                <div id="historicoHidden">
                    <table id="tableHistorico" tablename="tableHistorico" noaddbuttom="true" nodeletebuttom="true">
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>Data</th>
                                <th>Atividade</th>
                                <th>Observacao</th>
                                <th>Acao</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <input type="hidden" class="tableHistoricoUsuario" name="tableHistoricoUsuario"/>
                                </td>
                                <td>
                                    <input type="hidden" class="tableHistoricoData" name="tableHistoricoData"/>
                                </td>
                                <td>
                                    <input type="hidden" class="tableHistoricoAtividade" name="tableHistoricoAtividade" />
                                </td>
                                <td>
                                    <input type="hidden" class="tableHistoricoObservacao"name="tableHistoricoObservacao"/>
                                </td>
                                <td>
                                    <input type="hidden" class="tableHistoricoAcao" name="tableHistoricoAcao">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="tab-content;">
               <div class="tab-pane" id="tabCabeçalho">
                  <!-- PRÉ CADASTRO HEADER  -->
                  <div class="panel panel-default">
                     <div class="panel-body" style="border-left: 5px solid #f37021;">
                        <div class="row">
                           <div class="col-xs-1 text-center">
                              <i class="flaticon flaticon-account-circle icon-xl"></i>
                           </div>
                           <div class="col-xs-11">
                              <h4><strong>Pré Cadastro — Identificação e Endereço</strong></h4>
                              <p>Informe a classificação e os dados comerciais do cadastro.</p>
                              <span class="label label-warning">Etapa 1 de 3 — Pré Cadastro</span>
                           </div>
                        </div>
                     </div>
                  </div>
                  <!--  DADOS DO CLIENTE / FORNECEDOR -->
                  <div class="panel panel-default">
                     <div class="panel-heading" onclick="toggleSection(this)">
                        <div class="row">
                           <div class="col-xs-10">
                              <strong>1 - Dados do Cliente / Fornecedor</strong>
                              <span class="text-muted">4 campos</span>
                           </div>
                           <div class="col-xs-2 text-right">
                              <span class="glyphicon glyphicon-chevron-down"></span>
                           </div>
                        </div>
                     </div>

                     <div class="panel-body">
                        <div class="row">
                           <div class="form-group col-md-6">
                              <label>Classificação *</label>
                              <select name="classificacao" class="form-control" required>
                                 <option value="">Selecione...</option>
                                 <option>Cliente</option>
                                 <option>Fornecedor</option>
                                 <option>Cliente / Fornecedor</option>
                              </select>
                           </div>
                           <div class="form-group col-md-6">
                              <label>Categoria *</label>
                              <select name="categoria" id="categoria" class="form-control" required>
                                 <option value="">Selecione...</option>
                                 <option>Pessoa Jurídica</option>
                                 <option>Pessoa Física</option>
                              </select>
                           </div>
                           <div class="form-group col-md-6">
                              <label>Tipo *</label>
                              <select name="tipo" class="form-control" required>
                                 <option value="">Selecione...</option>
                                 <option>Subcontratado</option>
                                 <option>Transportadora</option>
                                 <option>Consultoria</option>
                                 <option>Materiais e Insumos</option>
                                 <option>Locação de Equipamentos</option>
                                 <option>Serviços Gerais</option>
                                 <option>Serviços de Engenharia</option>
                                 <option>Tecnologia e TI</option>
                              </select>
                           </div>
                           <div class="form-group col-md-6">
                              <label>Classificação Operacional *</label>
                              <select name="classificacaoOperacional" class="form-control" required>
                                 <option value="">Selecione...</option>
                                 <option>Obra / Construção Civil</option>
                                 <option>Mineração</option>
                                 <option>Infraestrutura Viária</option>
                                 <option>Pavimentação e Terraplanagem</option>
                                 <option>Saneamento e Drenagem</option>
                                 <option>Aluguel de Equipamentos</option>
                                 <option>Transporte e Logística</option>
                                 <option>Fornecimento de Materiais</option>
                                 <option>Serviços Administrativos</option>
                                 <option>Tecnologia e Sistemas</option>
                                 <option>Consultoria e Assessoria</option>
                                 <option>Seguro e Benefícios</option>
                              </select>
                           </div>
                        </div>
                     </div>
                  </div>



                  <!-- 2 - DADOS COMERCIAIS -->
                  <div class="panel panel-default">
                     <div class="panel-heading" onclick="toggleSection(this)">
                        <div class="row">
                           <div class="col-xs-10">
                              <strong>2 - Dados Comerciais</strong>
                              <span class="text-muted">Endereço e identificação</span>
                           </div>
                           <div class="col-xs-2 text-right">
                              <span class="glyphicon glyphicon-chevron-down"></span>
                           </div>
                        </div>
                     </div>
                     <div class="panel-body">
                        <div class="row">
                           <!-- CPF/CNPJ -->
                           <div class="form-group col-md-4">
                              <label>CPF / CNPJ *</label>
                              <input type="text" name="docFiscal" id="docFiscal" class="form-control">
                           </div>
                           <div class="form-group col-md-4">
                              <label>RG / Inscrição Estadual *</label>
                              <input type="text" name="docSecundario" class="form-control">
                           </div>
                           <div class="form-group col-md-4">
                              <label>Razão Social *</label>
                              <input type="text" name="razaoSocial" class="form-control" required>
                           </div>
                        </div>
                        <hr>
                        <div class="row">
                           <div class="form-group col-md-6">
                              <label>Endereço *</label>
                              <input type="text" name="endereco" class="form-control">
                           </div>
                           <div class="form-group col-md-2">
                              <label>Número *</label>
                              <input type="text" name="numero" class="form-control">
                           </div>
                           <div class="form-group col-md-4">
                              <label>Complemento</label>
                              <input type="text" name="complemento" class="form-control">
                           </div>
                           <div class="form-group col-md-3">
                              <label>Bairro *</label>
                              <input type="text" name="bairro" class="form-control">
                           </div>
                           <div class="form-group col-md-3">
                              <label>Cidade *</label>
                              <input type="text" name="cidade" class="form-control">
                           </div>
                           <div class="form-group col-md-2">
                              <label>CEP *</label>
                              <input type="text" name="cep" id="cep" class="form-control">
                           </div>
                           <div class="form-group col-md-2">
                              <label>UF *</label>
                              <select name="estado" class="form-control">
                                 <option>PR</option>
                                 <option>SP</option>
                                 <option>SC</option>
                              </select>
                           </div>
                           <div class="form-group col-md-2">
                              <label>País *</label>
                              <select name="pais" class="form-control">
                                 <option>Brasil</option>
                              </select>
                           </div>
                        </div>
                     </div>
                  </div>
               </div>

               <!-- PÁGINA HISTÓRICO -->
               <div class="pagina" id="paginaHistorico" data-index="1" >
                  <div class="conteudo-centro">
                     <h2>Histórico</h2>
                     <div id="divOpcoesAprovacao">
                           <div class="row">
                              <div class="col-md-12">
                                 <label for="observacoes">Observações: </label>
                                 <textarea name="observacoes" id="observacoes" class="form-control" rows="4"></textarea>
                                 <div></div>
                                 <br>
                              </div>
                           </div>
                           <div class="row">
                              <div class="col-md-12">
                                 <div class="panel panel-default" id="historico">
                                       <div class="panel-heading" style="background-color: #eaeaea;">
                                          <h4 class="panel-title" style="color: #58595b">Histórico</h4>
                                       </div>
                                       <div class="panel-body">
                                          <div id="panelHistorico">
                                             <div id="divLinhasHistorico"></div>
                                          </div>
                                       </div>
                                 </div>
                              </div>
                           </div>
                     </div>
                  </div>
               </div>
            </div>
         </form>
      </div>
   </body>
</html>
